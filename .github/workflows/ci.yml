name: CI

# Required checks for every PR and push to the default branch. A deploy must not
# proceed unless all of these pass (typecheck, lint, unit + security tests, migration
# validation, production build). No secrets are needed — tests run offline against a
# throwaway Postgres and the mock provider; real provider/billing secrets are never
# used in CI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biina
          POSTGRES_PASSWORD: biina
          POSTGRES_DB: biina
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://biina:biina@localhost:5432/biina
      CONNECTOR_CREDENTIAL_ENCRYPTION_KEY: ci-test-key-not-a-real-secret-000000000000
      AI_DEFAULT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run -w apps/web typecheck
      - name: Lint
        run: npm run -w apps/web lint
      - name: Migration validation (fresh DB, 0000→latest)
        run: npm run db:migrate -w apps/web
      - name: Unit + security tests
        run: npm run -w apps/web test
      - name: Production build
        run: npm run -w apps/web build
